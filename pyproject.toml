[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irs-pricer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "QuantLib",
    "fastapi",
    "uvicorn[standard]",
    "openpyxl",
    "xlwings",
    "requests",
    "python-dateutil",
    "sqlalchemy>=2.0",
    "pymysql",
    "alembic",
]

[tool.setuptools]
packages = ["irs_pricer"]
